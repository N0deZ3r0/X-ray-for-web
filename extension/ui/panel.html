<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>X-ray for web</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<!--
  Текст в разметке не пишется. Каждый узел с data-i18n получает строку из
  _locales по коду языка браузера; data-i18n-html — там, где внутри есть
  разметка. Пустые узлы до подстановки видны только доли секунды, зато нет
  второго места, где текст живёт и может разойтись с переводом.
-->

<header>
  <h1>X-ray</h1>
  <div id="origin" class="origin">—</div>
</header>

<div class="controls">
  <button id="start" class="primary" data-i18n="btn_record"></button>
  <button id="stop" hidden data-i18n="btn_stop"></button>
  <button id="clear" data-i18n="btn_clear"></button>
  <button id="export-report" data-i18n="btn_export_report"></button>
  <button id="export-json" data-i18n="btn_export_json"></button>
  <label class="check">
    <input type="checkbox" id="third-party">
    <span data-i18n="check_third_party"></span>
  </label>
  <label class="check danger">
    <input type="checkbox" id="raw-export">
    <span data-i18n="check_raw_export"></span>
  </label>
  <p class="hint" id="hint" data-i18n="hint_reload"></p>
</div>

<section class="scope">
  <b data-i18n="scope_title"></b>
  <span data-i18n="scope_text"></span>
  <br>
  <span data-i18n="scope_parsers"></span>
</section>

<h2 class="journal-h" data-i18n="h_facts"></h2>
<section id="facts" class="facts"></section>

<section id="health" class="health"></section>

<h2 class="journal-h" data-i18n="h_egress"></h2>
<main id="egress"></main>

<h2 class="journal-h" data-i18n="h_log"></h2>
<div id="filters" class="filters"></div>
<main id="log"></main>

<footer>
  <div class="limits">
    <b data-i18n="limits_title"></b>
    <ul>
      <li data-i18n-html="limit_internal"></li>
      <li data-i18n-html="limit_wrappers_visible"></li>
      <li data-i18n-html="limit_workers"></li>
      <li data-i18n-html="limit_other_extensions"></li>
      <li data-i18n-html="limit_websocket"></li>
      <li data-i18n-html="limit_parsers"></li>
      <li data-i18n-html="limit_in_stacks"></li>
      <li data-i18n-html="limit_unknown_source"></li>
    </ul>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="panel.js"></script>
</body>
</html>
