# One job, and deliberately so. This project has no dependencies, no build step and no
# browser automation: every suite is a plain `node` process with `chrome` stubbed, and the
# whole run takes under a second. Splitting that by cost would be splitting nothing.
#
# What CI actually guards here is the project's one hard rule — the instrument may not
# state more than it recorded. tests/facts.test.mjs is the suite that enforces it: remove
# an event, and the fact derived from it has to disappear. A green build means that rule
# still holds; it does not mean the extension was loaded in a real Chrome, which no
# runner here does.
#
# Node is pinned to 24 rather than "latest" because the suites read the extension's own
# source through node:vm and node:zlib. A floating major would turn a runtime change into
# a red build that has nothing to do with this code.
#
# Actions pinned to v7: v4 declares `using: node20`, which GitHub deprecated in September
# 2025 — it still runs, forced onto Node 24, and annotates every job with a warning.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Node suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # No `npm ci`: there is no package.json and no lockfile, by design. The absence of
      # dependencies is itself a claim the README makes, and this line is what keeps it
      # honest — if one ever appears, this step will not install it.
      - run: node tests/run.mjs

      # The locale files are generated from tools/messages.mjs, where the two
      # languages sit side by side. Regenerating must change nothing: if it does,
      # someone edited _locales by hand and the two languages have started to
      # drift — which is exactly the failure that shows up only for users whose
      # browser is in the other language.
      - name: locales are in sync with their source
        run: |
          node tools/messages.mjs
          git diff --exit-code -- extension/_locales

      # The icons are generated, not drawn. Regenerating them must produce byte-identical
      # files; if it does not, either the generator changed without the icons being
      # rebuilt, or the icons were edited by hand and the generator no longer describes
      # what ships.
      - name: icons are reproducible
        run: |
          node tools/icons.mjs
          git diff --exit-code -- extension/icons
